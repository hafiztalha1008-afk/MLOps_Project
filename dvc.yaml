stages:
  prepare:
    cmd: python src/prepare.py
    deps:
      - data/raw/winequality.csv
      - src/prepare.py
      - src/data.py
    params:
      - split.test_size
      - seed
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python src/train.py
    deps:
      - data/processed/train.csv
      - src/train.py
    params:
      - train.model
      - train.n_estimators
      - train.max_depth
      - seed
    outs:
      - models/model.pkl

  evaluate:
    cmd: python src/evaluate.py
    deps:
      - models/model.pkl
      - data/processed/test.csv
      - src/evaluate.py
    metrics:
      - metrics.json:
          cache: false
